services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: mmuser_password
      POSTGRES_DB: mattermost
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmuser -d mattermost"]
      interval: 5s
      timeout: 5s
      retries: 10

  mattermost:
    image: mattermost/mattermost-team-edition:11.7.2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8065:8065"
    environment:
      TZ: UTC
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mmuser:mmuser_password@postgres:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_SERVICESETTINGS_SITEURL: http://localhost:8065
      # Plugin development
      MM_PLUGINSETTINGS_ENABLE: "true"
      MM_PLUGINSETTINGS_ENABLEUPLOADS: "true"
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
      MM_SERVICESETTINGS_ENABLEDEVELOPER: "true"
      MM_SERVICESETTINGS_ENABLETESTING: "true"
      MM_LOGSETTINGS_CONSOLELEVEL: DEBUG
    volumes:
      - mm-config:/mattermost/config
      - mm-data:/mattermost/data
      - mm-logs:/mattermost/logs
      - mm-plugins:/mattermost/plugins
      - mm-client-plugins:/mattermost/client/plugins
      - mm-socket:/var/tmp

  # Test mail server for plugin development: IMAP and SMTP with local
  # delivery between its mailboxes. Not for production use.
  greenmail:
    image: greenmail/standalone:2.1.3
    restart: unless-stopped
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.auth.disabled=false
        -Dgreenmail.users.login=email
        -Dgreenmail.users=ivan:app-password@example.ru,anna:app-password@example.ru,boss:app-password@example.ru
        -Dgreenmail.verbose=false
    ports:
      - "3025:3025"   # SMTP
      - "3143:3143"   # IMAP
      - "3465:3465"   # SMTPS (self-signed)
      - "3993:3993"   # IMAPS (self-signed)

  # Collabora Online for viewing office attachments (optional):
  #   docker compose --profile office up -d collabora
  # Plugin settings: Collabora URL http://collabora:9980,
  # Mattermost address for Collabora http://mattermost:8065.
  collabora:
    image: collabora/code:latest
    profiles: ["office"]
    restart: unless-stopped
    environment:
      aliasgroup1: http://mattermost:8065
      server_name: localhost:9980
      extra_params: >-
        --o:ssl.enable=false
        --o:ssl.termination=false
        --o:net.proto=IPv4
        --o:welcome.enable=false
        --o:net.frame_ancestors=localhost:8065
      dictionaries: ru_RU en_US
    cap_add:
      - MKNOD
    ports:
      - "9980:9980"

volumes:
  postgres-data:
  mm-config:
  mm-data:
  mm-logs:
  mm-plugins:
  mm-client-plugins:
  mm-socket:
